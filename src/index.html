            <stop offset="0%" stop-color="#d8d4e8" />
            <stop offset="25%" stop-color="#e8eef2" />
            <stop offset="50%" stop-color="#ffffff" />
            <stop offset="75%" stop-color="#dbe6e8" />

              attributeName="gradientTransform"
              type="translate"
              from="-1 0"
              to="1 0"
              dur="3.5s"
              repeatCount="indefinite"
            />

              attributeName="gradientTransform"
              type="translate"
              from="-1.2 0"
              to="1.2 0"
              dur="5s"
              repeatCount="indefinite"
            />

          <radialGradient
            id="reflection"
            cx="850"
            cy="160"
            r="260"

          <filter id="depth" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />

              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
            <feDropShadow
              dx="0"
              dy="2"
              stdDeviation="2"
              flood-color="#000"
              flood-opacity="0.5"
            />
            <feDropShadow
              dx="0"
              dy="4"
              stdDeviation="4"
              flood-color="#000"
              flood-opacity="0.3"
            />
          </filter>
        </defs>
        <text
          class="holo-base"
          x="50%"
          y="230"
          text-anchor="middle"
          fill="#9ec5cc"
          opacity="0.3"
          transform="translate(-2 0)"

          cassmtnr

          class="holo-base"
          x="50%"
          y="230"
          text-anchor="middle"

        </text>
        <text
          x="50%"
          y="230"
          text-anchor="middle"

        </text>
        <text
          x="50%"
          y="230"
          text-anchor="middle"
          fill="url(#sheen)"
          style="mix-blend-mode: overlay;"
        >

        </text>
        <text
          class="holo-reflection"
          x="50%"
          y="230"
          text-anchor="middle"
